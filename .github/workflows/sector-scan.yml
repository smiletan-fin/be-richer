    runs-on: ubuntu-latest
    needs: [scan-banking, scan-technology, scan-plantation, scan-property, scan-healthcare, scan-consumer, scan-industrials, scan-energy, scan-reit]
    if: always() && (inputs.sector == 'all-sectors' || github.event_name == 'schedule')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Create Summary
        run: |
          echo "# 📊 All Sectors Screening Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Sector | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          for dir in all-reports/*/; do
            sector=$(basename "$dir" | sed 's/-report//')
            if [ -d "$dir" ] && [ "$(ls -A $dir)" ]; then
              echo "| $sector | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $sector | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
