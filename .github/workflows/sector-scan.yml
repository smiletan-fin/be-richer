name: Sector Stock Screener

on:
  workflow_dispatch:
    inputs:
      sector:
        description: 'Which sector to scan'
        required: true
        type: choice
        options:
          - all-sectors
          - banking
          - technology
          - plantation
          - property
          - healthcare
          - consumer
          - industrials
          - construction
          - energy
          - utilities
          - reit
          - telecommunications
          - transportation
      show_rejected:
        description: 'Include rejected stocks'
        required: false
        default: false
        type: boolean
  
  # Schedule: Run every Saturday at 8am Malaysia time (UTC+8 = 00:00 UTC)
  schedule:
    - cron: '0 0 * * 6'

jobs:
  # Single sector job (when specific sector selected)
  scan-single:
    name: Scan ${{ inputs.sector }}
    runs-on: ubuntu-latest
    if: inputs.sector != 'all-sectors'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache virtual environment
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.11-

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Activate venv
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: Run Sector Screener
        run: |
          mkdir -p results
          REJECTED_FLAG=""
          if [ "${{ inputs.show_rejected }}" = "true" ]; then
            REJECTED_FLAG="--show-rejected"
          fi
          
          python -m bursa_screener --sector ${{ inputs.sector }} --html $REJECTED_FLAG

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.sector }}-report-${{ github.run_number }}
          path: |
            results/*.html
            results/*.csv
          retention-days: 30

      - name: Summary
        run: |
          echo "## 📊 Sector Screening: ${{ inputs.sector }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sector:** ${{ inputs.sector }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Reports" >> $GITHUB_STEP_SUMMARY
          for f in results/*; do
            if [ -f "$f" ]; then
              fname=$(basename "$f")
              echo "- \`$fname\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download from **Artifacts** section below" >> $GITHUB_STEP_SUMMARY

  # All sectors scan (parallel jobs)
  scan-banking:
    name: 🏦 Banking
    runs-on: ubuntu-latest
    if: inputs.sector == 'all-sectors' || github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
      - name: Install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e .
      - name: Run
        run: |
          source .venv/bin/activate
          mkdir -p results
