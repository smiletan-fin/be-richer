          echo "| Sector | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          for dir in all-reports/*/; do
            if [ -d "$dir" ]; then
              sector=$(basename "$dir" | sed 's/-report//')
              if [ "$(ls -A $dir 2>/dev/null)" ]; then
                echo "| $sector | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
