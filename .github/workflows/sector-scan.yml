name: Sector Stock Screener

on:
  workflow_dispatch:
    inputs:
      sector:
        description: 'Sector to scan (all-sectors runs parallel jobs for each sector)'
        required: true
        type: choice
        options:
          - all-sectors
          - banking
          - technology
          - plantation
          - property
          - healthcare
          - consumer
          - industrials
          - construction
          - energy
          - utilities
          - reit
          - telecommunications
          - transportation
      tier:
        description: 'Stock universe: klci=30 blue chips, broad=~45 stocks, full=all listed stocks'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - broad
          - klci
      show_rejected:
        description: 'Include stocks that failed screening criteria'
        required: false
        default: false
        type: boolean
  
  # Schedule: Run every Saturday at 8am Malaysia time (UTC+8 = 00:00 UTC)
  schedule:
    - cron: '0 0 * * 6'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Single sector job (when specific sector selected via manual trigger)
  scan-single:
    name: Scan ${{ inputs.sector }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.sector != 'all-sectors'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Sector Screener
        run: |
          mkdir -p results
          REJECTED_FLAG=""
          if [ "${{ inputs.show_rejected }}" = "true" ]; then
            REJECTED_FLAG="--show-rejected"
          fi
          
          python -m bursa_screener --tier ${{ inputs.tier }} --sector ${{ inputs.sector }} --html $REJECTED_FLAG
          
          # Debug: show what files were created
          echo "=== Files in results directory ==="
          ls -la results/ || echo "No results directory"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.sector }}-report-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        run: |
          echo "## 📊 Sector Screening: ${{ inputs.sector }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sector:** ${{ inputs.sector }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tier:** ${{ inputs.tier }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Reports" >> $GITHUB_STEP_SUMMARY
          if [ -d "results" ] && [ "$(ls -A results 2>/dev/null)" ]; then
            for f in results/*; do
              if [ -f "$f" ]; then
                fname=$(basename "$f")
                echo "- \`$fname\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "⚠️ No report files generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download from **Artifacts** section below" >> $GITHUB_STEP_SUMMARY

  # All sectors scan (parallel jobs) - runs for 'all-sectors' selection OR scheduled runs
  scan-banking:
    name: 🏦 Banking
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && inputs.sector == 'all-sectors') || github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run
        run: |
          mkdir -p results
          TIER="${{ inputs.tier || 'full' }}"
          python -m bursa_screener --tier $TIER --sector banking --html
          ls -la results/
      - uses: actions/upload-artifact@v4
        with:
          name: banking-report
          path: results/
          if-no-files-found: warn
          retention-days: 30

